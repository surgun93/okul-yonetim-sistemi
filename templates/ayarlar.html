<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yönetim Paneli - Ayarlar</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { color: #333; text-align: center; }
        .form-group { background: #e9ecef; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input[type="file"] { margin-bottom: 10px; }
        .form-group button { background-color: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
        .form-group button:hover { background-color: #218838; }
        .back-btn { display: inline-block; margin-bottom: 20px; padding: 8px 12px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 4px; }
        .back-btn:hover { background-color: #5a6268; }
        .alert { background-color: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('index') }}" class="back-btn">← Ana Sayfaya Dön</a>
        <h1>Sistem Ayarları ve Dosya Yükleme Paneli</h1>

        <!-- Flaş Mesajlar -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert">{{ message }}</div>
            {% endfor %}
          %}
        {% endwith %}

        <!-- 1. Öğretmen Programı Yükleme -->
        <div class="form-group">
            <form method="POST" enctype="multipart/form-data">
                <label>Öğretmen Programı (PDF)</label>
                <input type="file" name="ogretmen_pdf_dosyasi" accept=".pdf" required>
                <button type="submit">Öğretmen Programını Güncelle</button>
            </form>
        </div>

        <!-- 2. Sınıf Programı Yükleme -->
        <div class="form-group">
            <form method="POST" enctype="multipart/form-data">
                <label>Sınıf Programı (PDF)</label>
                <input type="file" name="sinif_pdf_dosyasi" accept=".pdf" required>
                <button type="submit">Sınıf Programını Güncelle</button>
            </form>
        </div>

        <!-- 3. Pansiyon Nöbet Listesi Yükleme -->
        <div class="form-group">
            <form method="POST" enctype="multipart/form-data">
                <label>Pansiyon Nöbet Listesi (PDF, JPG, PNG)</label>
                <input type="file" name="pansiyon_pdf_dosyasi" accept=".pdf,.jpg,.jpeg,.png" required>
                <button type="submit">Pansiyon Nöbet Listesini Güncelle</button>
            </form>
        </div>

        <!-- 4. Nöbetçi Öğretmen Listesi Yükleme -->
        <div class="form-group">
            <form method="POST" enctype="multipart/form-data">
                <label>Nöbetçi Öğretmen Listesi (PDF, JPG, PNG)</label>
                <input type="file" name="nobetci_ogretmen_dosyasi" accept=".pdf,.jpg,.jpeg,.png" required>
                <button type="submit">Nöbetçi Öğretmen Listesini Güncelle</button>
            </form>
        </div>

        <!-- 5. Sınıf Rehber Öğretmenleri Listesi Yükleme -->
        <div class="form-group">
            <form method="POST" enctype="multipart/form-data">
                <label>Sınıf Rehber Öğretmenleri Listesi (PDF, JPG, PNG)</label>
                <input type="file" name="rehber_ogretmen_dosyasi" accept=".pdf,.jpg,.jpeg,.png" required>
                <button type="submit">Rehber Öğretmenler Listesini Güncelle</button>
            </form>
        </div>

        <!-- 6. Yeni: Kulüp Öğretmenleri Listesi Yükleme -->
        <div class="form-group">
            <form method="POST" enctype="multipart/form-data">
                <label>Kulüp Öğretmenleri Listesi (PDF, JPG, PNG)</label>
                <input type="file" name="klup_ogretmen_dosyasi" accept=".pdf,.jpg,.jpeg,.png" required>
                <button type="submit">Kulüp Öğretmenleri Listesini Güncelle</button>
            </form>
        </div>

        <!-- 7. Yeni: Sınav Programı Yükleme -->
        <div class="form-group">
            <form method="POST" enctype="multipart/form-data">
                <label>Sınav Programı (PDF, JPG, PNG)</label>
                <input type="file" name="sinav_programi_dosyasi" accept=".pdf,.jpg,.jpeg,.png" required>
                <button type="submit">Sınav Programını Güncelle</button>
            </form>
        </div>

    </div>
</body>
</html>
